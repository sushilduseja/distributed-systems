<!-- src/main/resources/static/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Stock Price Feed</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
            padding: 40px 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            font-size: 32px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #8b8d98;
            font-size: 14px;
        }
        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin-top: 12px;
        }
        .status.connected {
            background: #10b98120;
            color: #10b981;
        }
        .status.disconnected {
            background: #ef444420;
            color: #ef4444;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .price-card {
            background: #151932;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #1e2139;
        }
        .symbol {
            font-size: 13px;
            color: #8b8d98;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .price-display {
            font-size: 42px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }
        .price-change {
            font-size: 16px;
            font-weight: 500;
        }
        .price-change.up { color: #10b981; }
        .price-change.down { color: #ef4444; }
        .price-change.neutral { color: #8b8d98; }
        .timestamp {
            font-size: 11px;
            color: #8b8d98;
            margin-top: 12px;
        }
        .feed {
            background: #151932;
            border-radius: 12px;
            border: 1px solid #1e2139;
            overflow: hidden;
        }
        .feed-header {
            padding: 16px 20px;
            border-bottom: 1px solid #1e2139;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .feed-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }
        .feed-count {
            font-size: 12px;
            color: #8b8d98;
        }
        .feed-content {
            max-height: 400px;
            overflow-y: auto;
            padding: 12px;
        }
        .feed-item {
            padding: 10px 12px;
            margin-bottom: 4px;
            background: #0a0e27;
            border-radius: 6px;
            display: grid;
            grid-template-columns: 60px 1fr 100px 80px;
            gap: 12px;
            align-items: center;
            font-size: 13px;
            font-family: 'Monaco', 'Courier New', monospace;
        }
        .feed-symbol {
            font-weight: 600;
            color: #fff;
        }
        .feed-price { font-weight: 600; }
        .feed-change {
            font-size: 12px;
        }
        .feed-change.up { color: #10b981; }
        .feed-change.down { color: #ef4444; }
        .feed-time { color: #8b8d98; font-size: 11px; text-align: right; }
        .feed-content::-webkit-scrollbar { width: 6px; }
        .feed-content::-webkit-scrollbar-track { background: #0a0e27; }
        .feed-content::-webkit-scrollbar-thumb { background: #1e2139; border-radius: 3px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Real-Time Stock Price Feed</h1>
        <p class="subtitle">WebSocket + LMAX Disruptor + Java 21</p>
        <span id="status" class="status disconnected">Disconnected</span>
    </div>

    <div class="grid" id="stocks"></div>

    <div class="feed">
        <div class="feed-header">
            <span class="feed-title">Live Transaction Feed</span>
            <span class="feed-count" id="count">0 updates</span>
        </div>
        <div class="feed-content" id="feed"></div>
    </div>
</div>

<script>
    const stocks = ['TECH', 'FINX', 'ENRG', 'HLTH'];
    const stockNames = {
        'TECH': 'TechCorp Inc.',
        'FINX': 'FinanceX Global',
        'ENRG': 'Energy Dynamics',
        'HLTH': 'HealthPlus Systems'
    };
    const lastPrices = {};
    let updateCount = 0;
    let ws;
    let reconnectInterval;

    const stocksGrid = document.getElementById('stocks');
    stocks.forEach(symbol => {
        const card = document.createElement('div');
        card.className = 'price-card';
        card.innerHTML = `
                <div class="symbol">${symbol} · ${stockNames[symbol]}</div>
                <div class="price-display" id="price-${symbol}">---.--</div>
                <div class="price-change neutral" id="change-${symbol}">Waiting...</div>
                <div class="timestamp" id="time-${symbol}">--</div>
            `;
        stocksGrid.appendChild(card);
    });

    const statusEl = document.getElementById('status');
    const feedEl = document.getElementById('feed');
    const countEl = document.getElementById('count');

    function connect() {
        ws = new WebSocket('ws://' + window.location.host + '/prices');

        ws.onopen = () => {
            statusEl.textContent = 'Connected';
            statusEl.className = 'status connected';
            if (reconnectInterval) {
                clearInterval(reconnectInterval);
                reconnectInterval = null;
            }
        };

        ws.onclose = () => {
            statusEl.textContent = 'Disconnected';
            statusEl.className = 'status disconnected';
            if (!reconnectInterval) {
                reconnectInterval = setInterval(connect, 2000);
            }
        };

        ws.onerror = () => {
            ws.close();
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            updateCount++;

            const priceEl = document.getElementById(`price-${data.symbol}`);
            const changeEl = document.getElementById(`change-${data.symbol}`);
            const timeEl = document.getElementById(`time-${data.symbol}`);

            if (priceEl) {
                priceEl.textContent = data.price.toFixed(2);

                if (lastPrices[data.symbol] !== undefined) {
                    const diff = data.price - lastPrices[data.symbol];
                    const sign = diff >= 0 ? '+' : '';
                    changeEl.textContent = `${sign}${diff.toFixed(2)}`;
                    changeEl.className = `price-change ${diff > 0 ? 'up' : diff < 0 ? 'down' : 'neutral'}`;
                }

                const date = new Date(data.timestamp);
                timeEl.textContent = date.toLocaleTimeString();
            }

            const item = document.createElement('div');
            item.className = 'feed-item';
            const diff = lastPrices[data.symbol] !== undefined ? data.price - lastPrices[data.symbol] : 0;
            const changeClass = diff > 0 ? 'up' : diff < 0 ? 'down' : '';
            const sign = diff >= 0 ? '+' : '';

            item.innerHTML = `
                    <span class="feed-symbol">${data.symbol}</span>
                    <span class="feed-price">${data.price.toFixed(2)}</span>
                    <span class="feed-change ${changeClass}">${lastPrices[data.symbol] !== undefined ? sign + diff.toFixed(2) : '--'}</span>
                    <span class="feed-time">${new Date(data.timestamp).toLocaleTimeString()}</span>
                `;
            feedEl.insertBefore(item, feedEl.firstChild);

            if (feedEl.children.length > 100) {
                feedEl.removeChild(feedEl.lastChild);
            }

            countEl.textContent = `${updateCount} updates`;
            lastPrices[data.symbol] = data.price;
        };
    }

    connect();
</script>
</body>
</html>
